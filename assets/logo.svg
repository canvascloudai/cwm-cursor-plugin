<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="Cloud World Model">
  <title>Cloud World Model</title>
  <style>
    .bg   { fill: #ffffff; }
    .cloud{ fill: #1e293b; }
    .dot1 { fill: #3b82f6; }
    .dot2 { fill: #6366f1; }
    .dot3 { fill: #0ea5e9; }
    @media (prefers-color-scheme: dark) {
      .bg   { fill: #0f172a; }
      .cloud{ fill: #e2e8f0; }
      .dot1 { fill: #60a5fa; }
      .dot2 { fill: #818cf8; }
      .dot3 { fill: #38bdf8; }
    }
  </style>
  <rect width="32" height="32" rx="6" class="bg"/>
  <path class="cloud" d="M24.5 18.5a4 4 0 0 0-3.9-4 5.5 5.5 0 0 0-10.6 1.5A3.5 3.5 0 0 0 7.5 22H24a2.5 2.5 0 0 0 .5-3.5z"/>
  <circle class="dot1" cx="13" cy="25" r="1.5"/>
  <circle class="dot2" cx="17" cy="25" r="1.5"/>
  <circle class="dot3" cx="21" cy="25" r="1.5"/>
</svg>
